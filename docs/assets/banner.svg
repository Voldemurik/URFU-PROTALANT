<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="TechDoc Assistant — локальный LLM-ассистент по технической документации">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="20" fill="url(#grid)"/>

  <!-- pipeline glyph: documents → index → LLM → answer -->
  <g transform="translate(820 70)" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#e2e8f0">
    <g>
      <rect x="0" y="0" width="70" height="88" rx="8" fill="#ffffff" fill-opacity="0.08" stroke="#94a3b8" stroke-opacity="0.6"/>
      <path d="M14 22h42M14 38h42M14 54h30" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
      <text x="35" y="112" text-anchor="middle" fill="#cbd5e1">документы</text>
    </g>
    <path d="M78 44h34" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <g transform="translate(120 0)">
      <rect x="0" y="0" width="70" height="88" rx="8" fill="#ffffff" fill-opacity="0.08" stroke="#94a3b8" stroke-opacity="0.6"/>
      <circle cx="22" cy="30" r="5" fill="#38bdf8"/>
      <circle cx="46" cy="24" r="5" fill="#38bdf8"/>
      <circle cx="30" cy="58" r="5" fill="#a78bfa"/>
      <circle cx="52" cy="52" r="5" fill="#a78bfa"/>
      <path d="M22 30L46 24M30 58L52 52M22 30L30 58" stroke="#cbd5e1" stroke-opacity="0.5" stroke-width="1.5"/>
      <text x="35" y="112" text-anchor="middle" fill="#cbd5e1">индекс</text>
    </g>
    <path d="M198 44h34" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>
    <g transform="translate(240 0)">
      <rect x="0" y="0" width="70" height="88" rx="8" fill="#ffffff" fill-opacity="0.08" stroke="#94a3b8" stroke-opacity="0.6"/>
      <text x="35" y="52" text-anchor="middle" font-size="22" font-weight="700" fill="url(#accent)">LLM</text>
      <text x="35" y="112" text-anchor="middle" fill="#cbd5e1">локально</text>
    </g>
  </g>

  <g font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <text x="64" y="118" font-size="56" font-weight="800" fill="#f8fafc" letter-spacing="-1">TechDoc Assistant</text>
    <text x="64" y="160" font-size="24" fill="#cbd5e1">Локальный LLM-ассистент по технической документации</text>
    <text x="64" y="192" font-size="18" fill="#94a3b8">RAG · гибридный поиск · ссылки на источники · собственная система оценки · LoRA</text>

    <g transform="translate(64 222)">
      <rect width="330" height="36" rx="18" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-opacity="0.25"/>
      <text x="165" y="24" text-anchor="middle" font-size="16" fill="#e2e8f0">Программа «ПроТалант» УрФУ · 2026–2027</text>
    </g>
  </g>
</svg>
